# Vendored from Impactor v2.6.5 (3rdparty/omnisette) with workspace fields
# inlined. Only change: the Android client info in remote_anisette_v3.rs.
[package]
name = "omnisette"
edition = "2024"
version = "2.6.5"
authors = ["C <claration@riseup.net>"]
license = "MIT"
repository = "https://github.com/claration/Impactor"

[features]
remote-anisette = []
async = ["dep:async-trait"]
default = ["remote-anisette", "dep:remove-async-await"]
remote-anisette-v3 = [
    "async",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:chrono",
]
aos-kit = []

[dependencies]
sha2 = "0.11"
base64 = "0.22"
rand = "0.8"
plist = "1.8"
thiserror = "2.0"

hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip", "system-proxy"] }
uuid = { version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"] }
android-loader = { git = "https://github.com/Dadoum/android-loader", branch = "bigger_pages" }
libc = "0.2"
log = "0.4"
async-trait = { version = "0.1", optional = true }
remove-async-await = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio-tungstenite = { version = "0.27.0", optional = true, features = [
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.28", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }
anyhow = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
dlopen2 = "0.4"
objc = "0.2"
objc-foundation = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread"] }
simplelog = "0.12"

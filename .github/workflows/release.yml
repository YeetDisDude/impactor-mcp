# Builds prebuilt impactor-mcp binaries and attaches them to a GitHub release, so
# install.ps1 / install.sh can install without a Rust toolchain.
# Trigger: push a tag like `v2.6.5`, or run manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v2.6.5)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: impactor-mcp-windows-x86_64.exe, bin: impactor-mcp.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: impactor-mcp-windows-aarch64.exe, bin: impactor-mcp.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: impactor-mcp-macos-aarch64, bin: impactor-mcp }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: impactor-mcp-macos-x86_64, bin: impactor-mcp }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: impactor-mcp-linux-x86_64, bin: impactor-mcp }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: impactor-mcp-linux-aarch64, bin: impactor-mcp }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # MCP bundle (.mcpb) for the MCP Registry and one-click install in Claude Desktop.
      # Windows uses the x86_64 build (runs on Arm via emulation); a launcher picks the
      # macOS/Linux binary by architecture.
      - name: Build MCP bundle
        run: |
          mkdir -p bundle/server
          cp mcpb/manifest.json mcpb/icon.png bundle/
          cp mcpb/impactor-mcp bundle/server/
          cp dist/impactor-mcp-windows-x86_64.exe bundle/server/impactor-mcp.exe
          cp dist/impactor-mcp-macos-* dist/impactor-mcp-linux-* bundle/server/
          chmod +x bundle/server/*
          npx -y @anthropic-ai/mcpb validate bundle/manifest.json
          npx -y @anthropic-ai/mcpb pack bundle dist/impactor-mcp.mcpb
          sha256sum dist/impactor-mcp.mcpb

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*

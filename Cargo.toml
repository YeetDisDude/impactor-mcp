[package]
name = "impactor-mcp"
description = "Model Context Protocol (MCP) server exposing Impactor's sideloading features."
version = "2.6.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/claration/Impactor"

# Standalone project: it builds against the *official* Impactor release
# (git tag below) and shares its data directory, so it works next to the
# stock Impactor app without modifying or rebuilding it. Bump `tag` (all
# four places) to follow a newer Impactor release.
[workspace]

[dependencies]
plume_core = { git = "https://github.com/claration/Impactor", tag = "v2.6.5", features = ["tweaks"] }
plume_utils = { git = "https://github.com/claration/Impactor", tag = "v2.6.5" }
plume_store = { git = "https://github.com/claration/Impactor", tag = "v2.6.5" }
# Same revision Impactor v2.6.5 uses, so `Device` and friends are the same types.
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "5171e34e3a236842af1160a84d955d037ddca3af", default-features = false, features = [
    "full",
    "ring",
] }
plist = "1.8"
tokio = { version = "1.43", features = ["rt", "time", "fs"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
env_logger = "0.11"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"] }
zip = "8.6"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plume_gestalt = { git = "https://github.com/claration/Impactor", tag = "v2.6.5" }

# Impactor patches apple-codesign; use the same patched copy from the release.
[patch.crates-io]
apple-codesign = { git = "https://github.com/claration/Impactor", tag = "v2.6.5" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
# Unlike the GUI, keep unwinding: a panic inside one tool call is caught and
# reported instead of killing the long-running server.
panic = "unwind"
